name: Build postmarketOS (rosemary)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-pmos:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Set up Python 3.11+
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl rustc cargo expect
          python3 -m pip install --upgrade pip setuptools
          pip3 install git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap

      - name: Initialize pmbootstrap (using expect)
        run: |
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          cat << 'EOF' > /tmp/init_pmos.exp
          #!/usr/bin/expect -f
          set timeout 900
          spawn pmbootstrap --details-to-stdout init
          
          # Ждем именно промптов с квадратными скобками, чтобы не сработать на инфо-текст
          expect {
            -re "Work path \[.*\]: " { send "\r"; exp_continue }
            -re "pmaports path \[.*\]: " { send "\r"; exp_continue }
            -re "Channel \[.*\]: " { send "\r"; exp_continue }
            -re "Vendor \[.*\]: " { send "xiaomi\r"; exp_continue }
            -re "Device codename \[.*\]: " { send "rosemary-downstream\r"; exp_continue }
            "Continue? (y/n)" { send "y\r"; exp_continue }
            -re "Kernel \[.*\]: " { send "\r"; exp_continue }
            -re "Username \
