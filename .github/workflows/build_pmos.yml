name: Build postmarketOS (rosemary)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-pmos:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Set up Python 3.11+  # Требуется для tomllib
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl rustc cargo
          # Обновляем pip и setuptools
          python3 -m pip install --upgrade pip setuptools
          # Устанавливаем pmbootstrap напрямую из Git
          pip3 install git+https://gitlab.com/postmarketOS/pmbootstrap

      - name: Initialize pmbootstrap
        run: |
          printf 'xiaomi\nrosemary-downstream\n\n\n\n\n\n\ny\n' | pmbootstrap init

      - name: Build rootfs (pmbootstrap install)
        run: |
          pmbootstrap install

      - name: Zip build artifacts
        run: |
          cd ~/.local/var/pmbootstrap
          zip -r ~/pmos-rosemary-build.zip chroot_rootfs_xiaomi-rosemary chroot_native/boot

      - name: Upload artifact for download
        uses: actions/upload-artifact@v4
        with:
          name: pmos-rosemary-downstream-build
          path: ~/pmos-rosemary-build.zip
          retention-days: 14
          compression-level: 0
