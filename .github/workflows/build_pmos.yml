name: Build postmarketOS (rosemary)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-pmos:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Set up Python 3.11+
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl rustc cargo expect \
            binfmt-support qemu-user-static android-tools-fastboot
          python3 -m pip install --upgrade pip setuptools
          pip3 install git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap

      - name: Git tuning for large clones
        run: |
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Initialize pmbootstrap (generic expect)
        run: |
          cat << 'EOF' > /tmp/init_pmos.exp
          #!/usr/bin/expect -f
          set timeout 900
          log_user 1
          spawn pmbootstrap --details-to-stdout init
          expect {
            -re {Vendor.*:\s*$}          { send "xiaomi\r"; exp_continue }
            -re {Device codename.*:\s*$} { send "rosemary-downstream\r"; exp_continue }
            -re {User interface.*:\s*$}  { send "console\r"; exp_continue }
            -re {\(y/n\).*:\s*$}         { send "\r"; exp_continue }
            -re {\[.*\]:\s*$}            { send "\r"; exp_continue }
            eof
          }
          EOF
          expect -d /tmp/init_pmos.exp

      - name: Verify config
        run: pmbootstrap status

      - name: Build rootfs + kernel
        run: pmbootstrap -y install

      - name: Export images
        run: pmbootstrap export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-pmos-image
          path: /tmp/postmarketOS-export/*
