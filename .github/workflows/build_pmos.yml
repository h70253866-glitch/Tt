name: Build postmarketOS (rosemary)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-pmos:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Set up Python 3.11+
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl rustc cargo
          python3 -m pip install --upgrade pip setuptools
          pip3 install git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap

      - name: Initialize pmbootstrap
        run: |
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          # Порядок ответов:
          # 1. \n (Work path - дефолт)
          # 2. \n (pmaports path - дефолт)
          # 3. \n (Channel - дефолт edge)
          # 4. xiaomi (Vendor)
          # 5. rosemary-downstream (Device)
          # 6. y (Соглашаемся на использование архивного порта)
          # 7. \n (Kernel - дефолт)
          # 8. \n (Username - дефолт)
          # 9-12. \n (Providers x4 - дефолты)
          # 13. weston (UI - используем weston, чтобы избежать systemd)
          # 14. \n (Hostname - дефолт)
          # 15. \n (User password - дефолт)
          # 16. n (SSH keys)
          printf '\n\n\nxiaomi\nrosemary-downstream\ny\n\n\n\n\n\n\nweston\n\n\n\nn\n' | pmbootstrap init

      - name: Build rootfs (pmbootstrap install)
        run: |
          pmbootstrap install

      - name: Zip build artifacts
        run: |
          cd ~/.local/var/pmbootstrap
          zip -r ~/pmos-rosemary-build.zip chroot_rootfs_xiaomi-rosemary chroot_native/boot

      - name: Upload artifact for download
        uses: actions/upload-artifact@v4
        with:
          name: pmos-rosemary-downstream-build
          path: ~/pmos-rosemary-build.zip
          retention-days: 14
          compression-level: 0
