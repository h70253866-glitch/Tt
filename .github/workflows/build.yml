name: build-pmos-rosemary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip \
            binfmt-support qemu-user-static android-tools-fastboot

      - name: Clone pmbootstrap
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Clone pmaports
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git ~/pmaports

      - name: Configure pmbootstrap (no interactive init)
        working-directory: pmbootstrap
        run: |
          ./pmbootstrap.py config aports ~/pmaports
          ./pmbootstrap.py config work /tmp/pmbootstrap-work
          ./pmbootstrap.py config device rosemary-downstream
          ./pmbootstrap.py config ui console
          ./pmbootstrap.py config ui_extras False
          ./pmbootstrap.py config service_manager openrc
          ./pmbootstrap.py config hostname pmos-rosemary
          ./pmbootstrap.py config user user
          ./pmbootstrap.py config keymap us
          ./pmbootstrap.py config locale en_US.UTF-8
          ./pmbootstrap.py config timezone UTC
          ./pmbootstrap.py config jobs 4

      - name: Verify config
        working-directory: pmbootstrap
        run: ./pmbootstrap.py status

      - name: Build rootfs + kernel
        working-directory: pmbootstrap
        run: ./pmbootstrap.py -y install

      - name: Export images
        working-directory: pmbootstrap
        run: ./pmbootstrap.py export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-pmos-image
          path: /tmp/postmarketOS-export/*
