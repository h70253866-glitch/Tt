name: build-pmos-rosemary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip sudo \
            binfmt-support qemu-user-static android-tools-fastboot

      - name: Clone pmbootstrap
        run: git clone --depth=1 https://gitlab.com/postmarketOS/pmbootstrap.git

      - name: Write non-interactive config
        run: |
          mkdir -p ~/.config
          cat > ~/.config/pmbootstrap.cfg << 'EOF'
          [pmbootstrap]
          device = rosemary-downstream
          ui = console
          ui_extras = False
          systemd = 0
          keymap =
          timezone = UTC
          extra_packages = none
          hostname = pmos-rosemary
          work = /tmp/pmbootstrap-work
          aports = %(work)s/cache_git/pmaports
          EOF

      - name: Init pmbootstrap
        working-directory: pmbootstrap
        run: sudo ./pmbootstrap.py -q init || true
        # || true на случай что часть вопросов всё равно вылезет —
        # смотри лог шага, если упадёт на конкретном вопросе, добавим
        # его в конфиг явно (см. ниже "если не сработает")

      - name: Build rootfs + kernel
        working-directory: pmbootstrap
        run: sudo ./pmbootstrap.py install

      - name: Export images
        working-directory: pmbootstrap
        run: sudo ./pmbootstrap.py export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-pmos-image
          path: /tmp/postmarketOS-export/*
