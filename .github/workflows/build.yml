name: build-pmos-rosemary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip \
            binfmt-support qemu-user-static android-tools-fastboot expect

      - name: Clone pmbootstrap
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Init pmbootstrap (expect-driven)
        working-directory: pmbootstrap
        run: |
          cat > /tmp/init.exp << 'EOF'
          set timeout 120
          spawn ./pmbootstrap.py init
          expect {
            "vendor" { send "xiaomi\r"; exp_continue }
            "device" { send "rosemary-downstream\r"; exp_continue }
            "Enter number" { send "\r"; exp_continue }
            "systemd" { send "n\r"; exp_continue }
            "user interface" { send "console\r"; exp_continue }
            "extra packages" { send "\r"; exp_continue }
            "hostname" { send "pmos-rosemary\r"; exp_continue }
            "keymap" { send "\r"; exp_continue }
            "timezone" { send "\r"; exp_continue }
            eof
          }
          EOF
          expect -d /tmp/init.exp

      - name: Verify pmaports cloned
        working-directory: pmbootstrap
        run: |
          ls -la ~/.local/var/pmbootstrap/cache_git/pmaports || \
          (echo "pmaports missing, init failed" && exit 1)

      - name: Build rootfs + kernel
        working-directory: pmbootstrap
        run: ./pmbootstrap.py install

      - name: Export images
        working-directory: pmbootstrap
        run: ./pmbootstrap.py export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-pmos-image
          path: /tmp/postmarketOS-export/*
